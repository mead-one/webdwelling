<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="csrf-token" content="{{ .CSRFToken }}">
        <meta name="base-path" content="{{ .BasePath }}">
        <title>{{ .Title }}</title>
        <link rel="icon" href="{{ .BasePath }}/favicon.ico">
        <link rel="stylesheet" href="{{ .BasePath }}/style.css">
    </head>
    <body>
        <nav class="hamburger-menu">
            <input type="checkbox" id="hamburger-menu-checkbox">
            <label for="hamburger-menu-checkbox" id="hamburger-menu-btn">
                <span></span>
            </label>
            <ul class="hamburger-menu-list">
                {{ $basePath := .BasePath }}
                {{ range .NavItems }}
                <li>
                    {{ if eq .Method "POST" }}
                    <form action="{{ $basePath }}{{ .URL }}" method="post">
                        <input type="hidden" name="_csrf" value="{{ $.CSRFToken }}">
                        <button type="submit" class="hamburger-menu-item">{{ .Name }}</button>
                    </form>
                    {{ else }}
                    <a href="{{ $basePath }}{{ .URL }}" class="hamburger-menu-item">{{ .Name }}</a>
                    {{ end }}
                </li>
                {{ end }}
            </ul>
        </nav>
